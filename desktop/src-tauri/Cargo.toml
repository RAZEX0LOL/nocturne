[package]
name = "nocturne"
version = "1.0.0"
description = "Nocturne — клиент Navidrome"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nocturne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Обновлялка есть только там, где приложение ставят файлом: на телефонах обновления приносит магазин.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Windows: системные медиаэлементы (SMTC), кнопки в превью на панели задач, цвет акцента,
# настройки WebView2. Версии — те же, что тянет сам Tauri, чтобы типы совпадали.
[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-version = "0.1"
windows = { version = "0.62", features = [
  "Foundation",
  "Media",
  "Storage",
  "Storage_Streams",
  "UI",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
