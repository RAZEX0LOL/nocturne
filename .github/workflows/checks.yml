name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ядро iOS и общий контракт. Собирается как обычный пакет Swift, без Xcode-проекта,
  # поэтому не требует симуляторов и укладывается в минуты.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  # Ядро Android и тот же контракт. Android SDK здесь не нужен: -PcoreOnly собирает
  # только модуль core, это обычный JVM-код.
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PcoreOnly :core:test
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kotlin-test-report
          path: android/core/build/reports/tests/test
