name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ядро iOS и общий контракт. Собирается как обычный пакет Swift, без Xcode-проекта,
  # поэтому не требует симуляторов и укладывается в минуты.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test

  # Ядро Android и тот же контракт. Android SDK здесь не нужен: -PcoreOnly собирает
  # только модуль core, это обычный JVM-код.
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
      # Проверяет, что gradle-wrapper.jar — подлинный дистрибутив Gradle, а не подменённый бинарник.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PcoreOnly :core:test
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          retention-days: 7
          name: kotlin-test-report
          path: android/core/build/reports/tests/test

  # Ядро десктопа: тот же контракт третьим раннером плюс строгая проверка типов.
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun test
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop

  # Проверочный release APK с R8. Публичный CI не получает ключи официальной подписи.
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          retention-days: 7
          name: nocturne-android-ci
          path: android/app/build/outputs/apk/release/*.apk

  # Запросы и правда уходят по сети — к тому же моку, на котором проверяют себя все платформы.
  # Контрактные тесты разбирают готовые ответы, а здесь проверяется подпись и сборка адреса целиком.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Поднять мок Navidrome
        run: |
          python3 shared/mock-server/mock_navidrome.py 4 &
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:4533/radio" > /dev/null && break
            sleep 1
          done
      - run: bun test src/core/live.test.ts
        working-directory: desktop
        env:
          NOCTURNE_MOCK: http://127.0.0.1:4533

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run build
        working-directory: site

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check all Git history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          audit_tools="$RUNNER_TEMP/nocturne-gitleaks"
          mkdir -p "$audit_tools"
          curl --retry 3 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$audit_tools/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$audit_tools/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$audit_tools/gitleaks.tar.gz" -C "$audit_tools" gitleaks
          "$audit_tools/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner
