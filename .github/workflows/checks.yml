name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ядро iOS и общий контракт. Собирается как обычный пакет Swift, без Xcode-проекта,
  # поэтому не требует симуляторов и укладывается в минуты.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  # Ядро Android и тот же контракт. Android SDK здесь не нужен: -PcoreOnly собирает
  # только модуль core, это обычный JVM-код.
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Проверяет, что gradle-wrapper.jar — подлинный дистрибутив Gradle, а не подменённый бинарник.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PcoreOnly :core:test
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kotlin-test-report
          path: android/core/build/reports/tests/test

  # Ядро десктопа: тот же контракт третьим раннером плюс строгая проверка типов.
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun test
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop

  # Релизный apk: проверяет, что R8 не выбросил лишнего и что сборка подписывается.
  # Ключ в репозитории не лежит: без секретов apk получается неподписанным.
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Достать ключ подписи, если он задан секретами
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: ./gradlew :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-android
          path: android/app/build/outputs/apk/release/*.apk

  # Запросы и правда уходят по сети — к тому же моку, на котором проверяют себя все платформы.
  # Контрактные тесты разбирают готовые ответы, а здесь проверяется подпись и сборка адреса целиком.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Поднять мок Navidrome
        run: |
          python3 shared/mock-server/mock_navidrome.py 4 &
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:4533/rest/ping?u=demo&t=x&s=y&v=1.16.1&c=Nocturne&f=json" > /dev/null && break
            sleep 1
          done
      - run: bun test src/core/live.test.ts
        working-directory: desktop
        env:
          NOCTURNE_MOCK: http://127.0.0.1:4533
