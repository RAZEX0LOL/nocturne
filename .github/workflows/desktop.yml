name: desktop

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/check-windows-rename.ps1'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/check-windows-rename.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Собирает настольное приложение там, где оно должно работать: с Mac ни Windows, ни Linux
  # собрать нельзя. Готовые установщики лежат в артефактах сборки.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # WebKitGTK и сопутствующие библиотеки: на Linux Tauri рисует окно через них.
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri

      - run: bun install --frozen-lockfile
        working-directory: desktop

      # Проверочные сборки без ключей подписи официальных обновлений.
      - name: Собрать проверочные установщики
        working-directory: desktop
        shell: bash
        run: |
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.ci.json
          bun run tauri build --config src-tauri/tauri.ci.json

      - name: Проверить обновление Windows после переименования
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/check-windows-rename.ps1

      # Разбор имён файлов, безопасные имена загрузок, форматы — проверки Rust-стороны.
      - if: matrix.name == 'linux'
        run: cargo test
        working-directory: desktop/src-tauri

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          retention-days: 7
          name: nocturne-${{ matrix.name }}-ci
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
