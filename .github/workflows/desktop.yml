name: desktop

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Собирает настольное приложение там, где оно должно работать: с Mac ни Windows, ни Linux
  # собрать нельзя. Готовые установщики лежат в артефактах сборки.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      # WebKitGTK и сопутствующие библиотеки: на Linux Tauri рисует окно через них.
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: bun install --frozen-lockfile
        working-directory: desktop

      # Архив обновления подписывается ключом, которого в репозитории нет. Если секрет не задан,
      # собираем только установщики: иначе сборка падает на отсутствующем ключе.
      - name: Собрать установщики
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.ci.json
            bun run tauri build --config src-tauri/tauri.ci.json
          else
            bun run tauri build
          fi

      # Разбор имён файлов, безопасные имена загрузок, форматы — проверки Rust-стороны.
      - if: matrix.name == 'linux'
        run: cargo test
        working-directory: desktop/src-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
