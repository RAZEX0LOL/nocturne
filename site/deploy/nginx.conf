# nocturne.razex.online — статичный сайт Nocturne (site/ в репозитории).
# Снаружи — Cloudflare (проксирование): IP сервера из РФ заблокирован, а через Cloudflare сайт открывается.
# Сертификат Let's Encrypt (certbot --nginx) — его вписывает certbot, блок 443 он же и дополняет.
server {
    server_name nocturne.razex.online;

    root /var/www/nocturne;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Файлы сборки с хешем в имени — навсегда; страница — всегда свежая, иначе после выкладки
    # браузер держал бы старую разметку со ссылками на удалённые файлы.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /shots/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        # $uri.html — ради /start: страниц теперь две, и без этого /start падал бы на главную.
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nocturne.razex.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nocturne.razex.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = nocturne.razex.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nocturne.razex.online;
    return 404; # managed by Certbot


}